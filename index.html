<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配方工作站 · 列表 / 思维导图</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2129;--sub:#4e5969;--faint:#86909c;--line:#e5e6eb;--brand:#1f5fbf;--soft:#eaf1fc}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.bar b{font-size:15px}
.bar .sub{font-size:11.5px;color:var(--faint)}
.seg{margin-left:auto;padding:2px;border:1px solid var(--line);border-radius:8px;background:#f7f8fa;display:inline-flex;gap:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:6px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.frames{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
@media (max-width:640px){
  .bar{height:auto;flex:0 0 auto;flex-wrap:wrap;padding:8px 12px;gap:6px}
  .seg{margin-left:0;width:100%;justify-content:space-between}
  .seg button{flex:1}
}
</style>
</head>
<body>
<div class="bar">
  <b>配方工作站</b><span class="sub">列表 / 思维导图 · 同一份云端数据</span>
  <div class="seg">
    <button id="tabList" class="on">列表</button>
    <button id="tabMap">思维导图</button>
  </div>
  <button class="btn" id="btnOut">退出</button>
</div>
<div class="frames">
  <iframe id="fList" src="./list.html" title="列表模式"></iframe>
  <iframe id="fMap" src="./map.html" title="思维导图模式"></iframe>
</div>
<script>
(function(){
  var fList=document.getElementById('fList'), fMap=document.getElementById('fMap');
  var tabList=document.getElementById('tabList'), tabMap=document.getElementById('tabMap');
  var cur = location.hash === '#map' ? 'map' : 'list';

  function show(which){
    cur = which;
    fList.classList.toggle('on', which==='list');
    fMap.classList.toggle('on', which==='map');
    tabList.classList.toggle('on', which==='list');
    tabMap.classList.toggle('on', which==='map');
    history.replaceState(null,'', which==='map' ? '#map' : '#list');
    if (which==='map') prep(fMap); else prep(fList);
  }

  // 把子页面自己的顶栏收起来，避免出现两层标题；同时让它占满高度
  function prep(frame){
    try{
      var d = frame.contentDocument;
      if (!d) return;
      var h = d.querySelector('header');
      if (h) h.style.display = 'none';
      var w = d.querySelector('.workspace');
      if (w) w.style.height = '100vh';
      var wrap = d.querySelector('.wrap');
      if (wrap) wrap.style.paddingTop = '10px';
    }catch(e){}
  }

  fList.addEventListener('load', function(){ prep(fList); syncLogin(fList); });
  fMap.addEventListener('load', function(){ prep(fMap); syncLogin(fMap); });

  // 在一个模式里登录后，另一个模式自动跟着进入（两次登录很别扭）
  var lastPass = sessionStorage.getItem('fx_pass') || '';
  function syncLogin(frame){
    try{
      var doc = frame.contentDocument;
      if (!doc) return;
      var gate = doc.getElementById('gate');
      if (gate && gate.style.display !== 'none' && sessionStorage.getItem('fx_pass')==='1'){
        frame.contentWindow.location.reload();
      }
    }catch(e){}
  }
  setInterval(function(){
    var p = sessionStorage.getItem('fx_pass') || '';
    if (p !== lastPass){
      lastPass = p;
      fList.contentWindow.location.reload();
      fMap.contentWindow.location.reload();
    }
  }, 1200);

  tabList.onclick = function(){ show('list'); };
  tabMap.onclick = function(){ show('map'); };
  document.getElementById('btnOut').onclick = function(){
    sessionStorage.removeItem('fx_pass');
    fList.contentWindow.location.reload();
    fMap.contentWindow.location.reload();
  };
  show(cur);
})();
</script>
</body>
</html>
